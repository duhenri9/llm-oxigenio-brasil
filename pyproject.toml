[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-oxigenio-brasil"
version = "0.2.0"
description = "Pesquisa aberta Portuguese-first para LLMs brasileiros, dados, avaliação e raciocínio."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Eduardo", email = "duhenri9@gmail.com" }
]
keywords = [
  "llm",
  "português-brasileiro",
  "nlp",
  "biodiversidade",
  "avaliação",
  "open-science"
]
dependencies = []

[project.optional-dependencies]
benchmark = [
  "scikit-learn>=1.5,<2",
  "datasets>=3.0,<5"
]
api = [
  "scikit-learn>=1.5,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1"
]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "mypy>=1.10",
  "scikit-learn>=1.5,<2",
  "datasets>=3.0,<5",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1"
]

[project.scripts]
oxigen-benchmark = "oxigen.benchmarks.ptbr_intent:main"
oxigen-evidence = "oxigen.benchmarks.suite:main"
oxigen-olidbr = "oxigen.benchmarks.olid_br:main"
oxigen-drift = "oxigen.monitoring.drift:main"

[project.urls]
Homepage = "https://github.com/duhenri9/llm-oxigenio-brasil"
Repository = "https://github.com/duhenri9/llm-oxigenio-brasil"
Issues = "https://github.com/duhenri9/llm-oxigenio-brasil/issues"
Funding = "https://github.com/duhenri9/llm-oxigenio-brasil/blob/main/SUPPORT.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*", "datasets", "datasets.*"]
ignore_missing_imports = true
