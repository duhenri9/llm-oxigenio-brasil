name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@bfe8cc55a7890e3d6672eda6460ef37bfcc70755
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall src

      - name: Test
        run: python -m pytest tests/unit/ -v

      - name: Ruff lint
        run: python -m ruff check src tests

      - name: Ruff format check
        run: python -m ruff format --check src tests

      - name: Mypy
        run: python -m mypy src

      - name: Execute original PT-BR benchmark slice
        run: |
          python -m oxigen.benchmarks.ptbr_intent \
            --dataset data/benchmarks/ptbr-public-interest-intent-v0.jsonl \
            --out artifacts/ptbr-public-interest-intent-v0.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/ptbr-public-interest-intent-v0.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["benchmark"] == "ptbr-public-interest-intent"
          assert payload["benchmark_version"] == "0.1.0"
          assert payload["train_examples"] == 36
          assert payload["eval_examples"] == 12
          assert len(payload["dataset_sha256"]) == 64
          assert len(payload["predictions"]) == 12
          print(json.dumps({
              "accuracy": payload["accuracy"],
              "macro_f1": payload["macro_f1"],
              "dataset_sha256": payload["dataset_sha256"],
          }, indent=2))
          PY

      - name: Generate operational evidence pack
        run: |
          oxigen-evidence \
            --dataset data/benchmarks/ptbr-public-interest-intent-v0.jsonl \
            --source-manifest data/benchmarks/ptbr-public-interest-intent-v0.manifest.json \
            --out-dir artifacts/ptbr-suite

      - name: Prove drift monitor positive control
        run: |
          oxigen-drift \
            --reference data/benchmarks/ptbr-public-interest-intent-v0.jsonl \
            --candidate data/benchmarks/ptbr-public-interest-intent-v0.jsonl \
            --expect PASS \
            --out artifacts/drift-self-check.json

      - name: Build drift negative control
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path("data/benchmarks/ptbr-public-interest-intent-v0.jsonl")
          target = Path("artifacts/drift-negative-control.jsonl")
          target.parent.mkdir(parents=True, exist_ok=True)
          rows = []
          for line in source.read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              row = json.loads(line)
              if row["split"] == "eval":
                  row["text"] = (row["text"] + " contexto adicional") * 8
              rows.append(json.dumps(row, ensure_ascii=False, sort_keys=True))
          target.write_text("\n".join(rows) + "\n", encoding="utf-8")
          print(target)
          PY

      - name: Prove drift monitor detects the negative control
        run: |
          oxigen-drift \
            --reference data/benchmarks/ptbr-public-interest-intent-v0.jsonl \
            --candidate artifacts/drift-negative-control.jsonl \
            --expect DRIFT \
            --out artifacts/drift-negative-control-result.json

      - name: Build evidence API container
        run: docker build -t oxigenio-evidence-ci .

      - name: Smoke-test container health endpoint
        run: |
          container_id=$(docker run -d -p 8000:8000 oxigenio-evidence-ci)
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/health > artifacts/container-health.json; then
              cat artifacts/container-health.json
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_id"
          exit 1

      - name: Upload operational ML evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oxigenio-operational-ml-evidence
          path: artifacts/
          if-no-files-found: error
